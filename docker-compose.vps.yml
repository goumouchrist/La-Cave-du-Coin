services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      # Valeur par défaut volontairement invalide (pas vide) : un Caddyfile
      # avec une adresse de site vide ne démarre pas du tout. Tant que
      # PGADMIN_DOMAIN n'est pas renseigné dans .env, ce bloc ne correspond
      # simplement à aucun trafic réel.
      PGADMIN_DOMAIN: ${PGADMIN_DOMAIN:-pgadmin.disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      # Réseau partagé avec le stack "staging" (cf. docker-compose.staging.yml)
      # pour pouvoir router staging/pgAdmin sans exposer leurs ports au public.
      - caddy_net

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    name: caddy_net
    external: true
