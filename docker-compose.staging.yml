services:
  db:
    # Uniquement accessible depuis le VPS lui-même (127.0.0.1) : jamais
    # exposé sur internet, même avec pare-feu. Connexion via tunnel SSH
    # (cf. DEPLOYMENT.md, section "Environnement de test ISO prod").
    ports:
      - "127.0.0.1:55432:5432"

  app:
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      default:
      # Rejoint le réseau partagé avec le stack prod pour être joignable
      # depuis Caddy (cf. Caddyfile + STAGING_DOMAIN dans le .env de prod),
      # sous un alias distinct de l'"app" de prod pour éviter toute collision
      # de nom sur ce réseau partagé — même principe que "proddb" pour la
      # base de données (voir docker-compose.yml).
      caddy-net:
        aliases:
          - stagingapp

  # Interface web pour interroger la base staging depuis un navigateur (via
  # Caddy/HTTPS, cf. Caddyfile + PGADMIN_DOMAIN dans le .env de prod) plutôt
  # que via un tunnel SSH — utile quand le tunnel SSH n'est pas utilisable
  # (ex: poste géré interceptant les connexions brutes/SSH).
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@lacaveducoin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - caddy-net

volumes:
  pgadmin_data:

networks:
  caddy-net:
    name: caddy-net
    external: true
